<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaxmat — Zamonaviy Onlayn O'yin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chess.js kutubxonasi (barcha rasmiy shaxmat qoidalari uchun) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-panel: #111827;
            --board-light: #cbd5e1;
            --board-dark: #475569;
            --accent-emerald: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(16, 185, 129, 0.08), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.08), transparent 35%);
            color: #f8fafc;
            min-height: 100vh;
            user-select: none;
        }

        .font-mono-code {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Shaxmat taxtasi va kataklari */
        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            aspect-ratio: 1 / 1;
            width: 100%;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .square {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .square.light {
            background-color: #cbd5e1; /* Slate 300 */
        }

        .square.dark {
            background-color: #475569; /* Slate 600 */
        }

        /* Tanlangan katak */
        .square.selected {
            background-color: rgba(16, 185, 129, 0.65) !important;
        }

        /* Oxirgi yurish yoritilishi */
        .square.last-move-light {
            background-color: #fde68a !important; /* Amber 200 */
        }
        .square.last-move-dark {
            background-color: #d97706 !important; /* Amber 600 */
        }

        /* Shoh (Check) holati */
        .square.in-check {
            background: radial-gradient(circle, rgba(239, 68, 68, 0.95) 20%, rgba(185, 28, 28, 0.85) 85%) !important;
            animation: pulseCheck 1.2s infinite alternate;
        }

        @keyframes pulseCheck {
            from { box-shadow: inset 0 0 8px rgba(239, 68, 68, 0.8); }
            to { box-shadow: inset 0 0 20px rgba(254, 202, 202, 0.95); }
        }

        /* Yurish nuqtalari va urish halqalari */
        .hint-dot {
            width: 28%;
            height: 28%;
            border-radius: 50%;
            background-color: rgba(16, 185, 129, 0.65);
            pointer-events: none;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
            transition: transform 0.15s ease;
        }

        .square:hover .hint-dot {
            transform: scale(1.2);
            background-color: rgba(16, 185, 129, 0.85);
        }

        .hint-capture {
            position: absolute;
            inset: 6%;
            border-radius: 50%;
            border: 4px solid rgba(239, 68, 68, 0.75);
            pointer-events: none;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }

        /* Shaxmat donalari SVG */
        .piece-svg {
            width: 82%;
            height: 82%;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.45));
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .square:hover .piece-svg {
            transform: translateY(-2px) scale(1.04);
        }

        /* Koordinatalar (a-h, 1-8) */
        .coord-rank {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
            opacity: 0.8;
        }

        .coord-file {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
            opacity: 0.8;
        }

        .square.light .coord-rank,
        .square.light .coord-file {
            color: #334155;
        }

        .square.dark .coord-rank,
        .square.dark .coord-file {
            color: #e2e8f0;
        }

        /* Custom Scrollbar for Move History */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Mode & Difficulty Active Buttons */
        .pill-btn.active {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #022c22;
            font-weight: 700;
            border-color: #34d399;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }
    </style>
</head>
<body class="p-3 sm:p-6 flex flex-col items-center justify-center">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>

    <script>
        /**
         * 1. WEB AUDIO API OVOZ EFFEKTLARI
         * Tashqi fayllarsiz toza shaxmat tovushlarini sintez qiladi
         */
        class ChessSound {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playMove() {
                if (!this.enabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(190, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(95, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.09);
                } catch (e) {}
            }

            playCapture() {
                if (!this.enabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.14);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                } catch (e) {}
            }

            playCastle() {
                if (!this.enabled) return;
                this.playMove();
                setTimeout(() => this.playMove(), 95);
            }

            playCheck() {
                if (!this.enabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(660, this.ctx.currentTime);
                    osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.09);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.23);
                } catch (e) {}
            }

            playGameOver() {
                if (!this.enabled) return;
                try {
                    this.init();
                    const notes = [523.25, 659.25, 783.99, 1046.5];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        const t = this.ctx.currentTime + idx * 0.11;
                        osc.frequency.setValueAtTime(freq, t);
                        gain.gain.setValueAtTime(0.18, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(t);
                        osc.stop(t + 0.36);
                    });
                } catch (e) {}
            }
        }

        /**
         * 2. YUQORI SIFATLI STAUNTON SVG SHAXMAT DONALARI
         */
        const PIECE_SVGS = {

            k: [
                [-30,-40,-40,-50,-50,-40,-40,-30],

                [ 20, 20,  0,  0,  0,  0, 20, 20],
                [ 20, 30, 10,  0,  0, 10, 30, 20]
            ]
        };

        function evaluateBoard(gameInstance) {
            const board = gameInstance.board();
            let totalEvaluation = 0;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        const baseVal = PIECE_VALUES[piece.type];
                        const pstRow = piece.color === 'w' ? r : 7 - r;
                        const posVal = PST[piece.type][pstRow][c];
                        const val = baseVal + posVal;
                        totalEvaluation += piece.color === 'w' ? val : -val;
                    }
                }
            }
            return totalEvaluation;
        }

        function minimax(gameInstance, depth, alpha, beta, isMaximizingPlayer) {
            if (depth === 0 || gameInstance.game_over()) {
                if (gameInstance.in_checkmate()) {
                    return isMaximizingPlayer ? -99999 - depth : 99999 + depth;
                }
                if (gameInstance.in_draw() || gameInstance.in_stalemate()) {
                    return 0;
                }
                return evaluateBoard(gameInstance);
            }

            const moves = gameInstance.moves();
            // Urish yurishlarini oldinroq tekshirish (Alpha-Beta tezlashtirish)
            moves.sort((a, b) => (b.includes('x') ? 1 : 0) - (a.includes('x') ? 1 : 0));

            if (isMaximizingPlayer) {
                let maxEval = -Infinity;
                for (let i = 0; i < moves.length; i++) {
                    gameInstance.move(moves[i]);
                    const evaluation = minimax(gameInstance, depth - 1, alpha, beta, false);
                    gameInstance.undo();
                    maxEval = Math.max(maxEval, evaluation);
                    alpha = Math.max(alpha, evaluation);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let i = 0; i < moves.length; i++) {
                    gameInstance.move(moves[i]);
                    const evaluation = minimax(gameInstance, depth - 1, alpha, beta, true);
                    gameInstance.undo();
                    minEval = Math.min(minEval, evaluation);
                    beta = Math.min(beta, evaluation);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function computeBestAiMove(gameInstance, difficulty) {
            const possibleMoves = gameInstance.moves({ verbose: true });
            if (possibleMoves.length === 0) return null;

            // Oson daraja: Ko'proq tasodifiy yurishlar, ba'zida urish
            if (difficulty === 'easy') {
                const captures = possibleMoves.filter(m => m.captured);
                if (captures.length > 0 && Math.random() < 0.45) {
                    return captures[Math.floor(Math.random() * captures.length)];
                }
                return possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
            }

            // O'rtacha daraja: 2-qadam chuqurlikdagi Minimax + Alpha-Beta
            let bestMove = null;
            let bestValue = Infinity; // Bot qora ('b') rangda o'ynaydi, demak minimal ball qidiradi

            // Bir xil qiymatli yurishlar orasida xilma-xillik bo'lishi uchun aralashtiramiz
            possibleMoves.sort(() => Math.random() - 0.5);

            for (let i = 0; i < possibleMoves.length; i++) {
                const move = possibleMoves[i];
                gameInstance.move(move);
                const boardValue = minimax(gameInstance, 2, -Infinity, Infinity, true);
                gameInstance.undo();

                if (boardValue < bestValue) {
                    bestValue = boardValue;
                    bestMove = move;
                }
            }
            return bestMove || possibleMoves[0];
        }

         */
        const chess = new Chess();
        const sound = new ChessSound();

        let gameMode = 'ai'; // 'ai' yoki 'pvp'
        let aiDifficulty = 'medium'; // 'easy' yoki 'medium'

        let selectedSquare = null;
        let legalMovesForSelected = [];
        let pendingPromotion = null;
        let isAiThinking = false;

        // DOM elementlar
        const boardEl = document.getElementById('chess-board');
        const statusTextEl = document.getElementById('status-text');
        const statusCardEl = document.getElementById('status-card');
        const thinkingEl = document.getElementById('thinking-indicator');

        const moveCountEl = document.getElementById('move-count');
        const promotionModalEl = document.getElementById('promotion-modal');
        const promotionChoicesEl = document.getElementById('promotion-choices');

        const btnModeAi = document.getElementById('btn-mode-ai');
        const btnModePvp = document.getElementById('btn-mode-pvp');
        const aiDiffContainer = document.getElementById('ai-diff-container');
        const btnDiffEasy = document.getElementById('btn-diff-easy');
        const btnDiffMedium = document.getElementById('btn-diff-medium');
        const btnNewGame = document.getElementById('btn-new-game');
        const btnUndo = document.getElementById('btn-undo');
        const btnFlip = document.getElementById('btn-flip');
        const btnSound = document.getElementById('btn-sound');

        const FILES = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const RANKS = ['8', '7', '6', '5', '4', '3', '2', '1'];

        // Shaxmat taxtasini chizish
        function renderBoard() {
            boardEl.innerHTML = '';
            const boardState = chess.board();
            const history = chess.history({ verbose: true });
            const lastMove = history.length > 0 ? history[history.length - 1] : null;

            // Shoh (Check) ostidagi shoh katagini aniqlash
            let checkedKingSquare = null;
            if (chess.in_check()) {
                const turnColor = chess.turn();
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const p = boardState[r][c];
                        if (p && p.type === 'k' && p.color === turnColor) {
                            checkedKingSquare = FILES[c] + RANKS[r];
                        }
                    }
                }
            }

            const rowIndices = boardOrientation === 'w' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
            const colIndices = boardOrientation === 'w' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];

            rowIndices.forEach((r, visualRowIdx) => {
                colIndices.forEach((c, visualColIdx) => {
                    const squareName = FILES[c] + RANKS[r];
                    const isLight = (r + c) % 2 === 0;
                    const piece = boardState[r][c];

                    const sqDiv = document.createElement('div');
                    sqDiv.className = `square ${isLight ? 'light' : 'dark'}`;
                    sqDiv.dataset.square = squareName;

                    // Oxirgi yurish yoritilishi
                    if (lastMove && (lastMove.from === squareName || lastMove.to === squareName)) {
                        sqDiv.classList.add(isLight ? 'last-move-light' : 'last-move-dark');
                    }

                    // Tanlangan katak
                    if (selectedSquare === squareName) {
                        sqDiv.classList.add('selected');
                    }

                    // Shoh (Check) katagi
                    if (checkedKingSquare === squareName) {
                        sqDiv.classList.add('in-check');
                    }

                    // Koordinatalarni ko'rsatish (faqat chetki qator va ustunlarda)
                    if (visualColIdx === 0) {
                        const rankSpan = document.createElement('span');
                        rankSpan.className = 'coord-rank';
                        rankSpan.textContent = RANKS[r];
                        sqDiv.appendChild(rankSpan);
                    }
                    if (visualRowIdx === 7) {
                        const fileSpan = document.createElement('span');
                        fileSpan.className = 'coord-file';
                        fileSpan.textContent = FILES[c];
                        sqDiv.appendChild(fileSpan);
                    }

                    // Dona rasmini qo'shish
                    if (piece) {
                        const pieceKey = piece.color + piece.type.toUpperCase();
                        sqDiv.insertAdjacentHTML('beforeend', PIECE_SVGS[pieceKey]);
                    }

                    // Ruxsat etilgan yurish nuqtalari va urish halqalari
                    const moveHint = legalMovesForSelected.find(m => m.to === squareName);
                    if (moveHint) {
                        if (moveHint.captured || moveHint.flags.includes('e')) {
                            const ring = document.createElement('div');
                            ring.className = 'hint-capture';
                            sqDiv.appendChild(ring);
                        } else {
                            const dot = document.createElement('div');
                            dot.className = 'hint-dot';
                            sqDiv.appendChild(dot);
                        }
                    }

                    sqDiv.addEventListener('click', () => handleSquareClick(squareName));
                    boardEl.appendChild(sqDiv);
                });
            });

            updatePlayerPanels();
            updateStatusPanel();
            updateMoveHistory();
            btnUndo.disabled = chess.history().length === 0 || isAiThinking;
        }

        // Katak bosilgandagi mantiq
        function handleSquareClick(square) {
            if (chess.game_over() || isAiThinking || pendingPromotion) return;

            // Agar AI rejimida bo'lsa, foydalanuvchi faqat oq donalarni ('w') boshqaradi
            if (gameMode === 'ai' && chess.turn() !== 'w') return;

            // Agar ruxsat etilgan manzil katagi bosilgan bo'lsa -> yurishni bajaramiz
            const targetMove = legalMovesForSelected.find(m => m.to === square);
            if (targetMove) {
                // Piyoda oxirgi qatorga yetib borganda (Promotion)
                if (targetMove.flags.includes('p')) {
                    openPromotionModal(targetMove.from, targetMove.to, chess.turn());
                    return;
                }
                executeMove({ from: targetMove.from, to: targetMove.to });
                return;
            }

            // O'z donasini tanlash yoki tanlovni bekor qilish
            const clickedPiece = chess.get(square);
            if (clickedPiece && clickedPiece.color === chess.turn()) {
                if (selectedSquare === square) {
                    selectedSquare = null;
                    legalMovesForSelected = [];
                } else {
                    selectedSquare = square;
                    legalMovesForSelected = chess.moves({ square: square, verbose: true });
                }
            } else {
                selectedSquare = null;
                legalMovesForSelected = [];
            }

            renderBoard();
        }

        // Yurishni amalga oshirish
        function executeMove(moveObj) {
            const moveResult = chess.move(moveObj);
            if (!moveResult) return;

            selectedSquare = null;
            legalMovesForSelected = [];

            // Ovoz effektlari
            if (chess.in_checkmate() || chess.in_draw()) {
                sound.playGameOver();
            } else if (chess.in_check()) {
                sound.playCheck();
            } else if (moveResult.flags.includes('k') || moveResult.flags.includes('q')) {
                sound.playCastle();
            } else if (moveResult.captured) {
                sound.playCapture();
            } else {
                sound.playMove();
            }

            renderBoard();

            // Agar AI rejimi bo'lsa va navbat Qoralarga ('b') o'tgan bo'lsa
            if (!chess.game_over() && gameMode === 'ai' && chess.turn() === 'b') {
                triggerAiTurn();
            }
        }

        // Bot yurishini ishga tushirish
        function triggerAiTurn() {
            isAiThinking = true;
            thinkingEl.classList.remove('hidden');
            btnUndo.disabled = true;

            aiTimer = setTimeout(() => {
                const bestMove = computeBestAiMove(chess, aiDifficulty);
                isAiThinking = false;
                thinkingEl.classList.add('hidden');

                if (bestMove) {
                    executeMove({
                        from: bestMove.from,
                        to: bestMove.to,
                        promotion: bestMove.promotion || 'q'
                    });
                } else {
                    renderBoard();
                }
            }, 350);
        }

        // Piyoda almashtirish (Promotion) modali
        function openPromotionModal(from, to, color) {
            pendingPromotion = { from, to };
            promotionChoicesEl.innerHTML = '';
            const pieces = ['q', 'r', 'b', 'n'];

            pieces.forEach(pType => {
                const btn = document.createElement('button');
                btn.className = 'aspect-square rounded-xl bg-slate-800 hover:bg-emerald-500/20 border border-slate-700 hover:border-emerald-400 flex items-center justify-center transition-all active:scale-95';
                const key = color + pType.toUpperCase();
                btn.innerHTML = PIECE_SVGS[key];
                btn.addEventListener('click', () => {
                    promotionModalEl.classList.add('hidden');
                    const moveData = { from: pendingPromotion.from, to: pendingPromotion.to, promotion: pType };
                    pendingPromotion = null;
                    executeMove(moveData);
                });
                promotionChoicesEl.appendChild(btn);
            });

            promotionModalEl.classList.remove('hidden');
        }

        // Yutilgan donalar va ustunlik ballarini hisoblash
        function getCapturedAndMaterial() {
            const initialCounts = { p: 8, n: 2, b: 2, r: 2, q: 1 };
            const currentCounts = {
                w: { p: 0, n: 0, b: 0, r: 0, q: 0 },
                b: { p: 0, n: 0, b: 0, r: 0, q: 0 }
            };

            const boardState = chess.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = boardState[r][c];
                    if (p && p.type !== 'k') {
                        currentCounts[p.color][p.type]++;
                    }
                }
            }

            // Oqlar yutib olgan qora donalar, Qoralar yutib olgan oq donalar
            const capturedByWhite = [];
            const capturedByBlack = [];
            const order = ['q', 'r', 'b', 'n', 'p'];
            const matValues = { p: 1, n: 3, b: 3, r: 5, q: 9 };

            let whiteScore = 0;
            let blackScore = 0;

            order.forEach(type => {
                const lostBlack = Math.max(0, initialCounts[type] - currentCounts.b[type]);
                for (let i = 0; i < lostBlack; i++) {
                    capturedByWhite.push('b' + type.toUpperCase());
                    whiteScore += matValues[type];
                }

                const lostWhite = Math.max(0, initialCounts[type] - currentCounts.w[type]);
                for (let i = 0; i < lostWhite; i++) {
                    capturedByBlack.push('w' + type.toUpperCase());
                    blackScore += matValues[type];
                }
            });

            return {
                wCaptured: capturedByWhite,
                bCaptured: capturedByBlack,
                diff: whiteScore - blackScore
            };
        }

        // Yuqori va Pastki o'yinchi kartochkalarini yangilash
        function updatePlayerPanels() {
            const topColor = boardOrientation === 'w' ? 'b' : 'w';
            const bottomColor = boardOrientation === 'w' ? 'w' : 'b';
            const turn = chess.turn();
            const isOver = chess.game_over();

            const topNameEl = document.getElementById('top-player-name');
            const topAvatarEl = document.getElementById('top-player-avatar');
            const topBadgeEl = document.getElementById('top-player-badge');
            const topCapturedEl = document.getElementById('top-captured');
            const topAdvEl = document.getElementById('top-advantage');

            const bottomNameEl = document.getElementById('bottom-player-name');
            const bottomAvatarEl = document.getElementById('bottom-player-avatar');
            const bottomBadgeEl = document.getElementById('bottom-player-badge');
            const bottomCapturedEl = document.getElementById('bottom-captured');
            const bottomAdvEl = document.getElementById('bottom-advantage');

            const getPlayerMeta = (color) => {
                if (gameMode === 'ai') {
                    return color === 'w'
                        ? { name: 'Oqlar (Siz)', icon: '👤' }
                        : { name: `Qoralar (Bot • ${aiDifficulty === 'easy' ? 'Oson' : "O'rtacha"})`, icon: '🤖' };
                } else {
                    return color === 'w'
                        ? { name: 'Oqlar (1-o\'yinchi)', icon: '♔' }
                        : { name: 'Qoralar (2-o\'yinchi)', icon: '♚' };
                }
            };

            const topMeta = getPlayerMeta(topColor);
            const bottomMeta = getPlayerMeta(bottomColor);

            topNameEl.textContent = topMeta.name;
            topAvatarEl.textContent = topMeta.icon;
            bottomNameEl.textContent = bottomMeta.name;
            bottomAvatarEl.textContent = bottomMeta.icon;

            // Navbat belgisi
            topBadgeEl.classList.toggle('hidden', isOver || turn !== topColor);
            bottomBadgeEl.classList.toggle('hidden', isOver || turn !== bottomColor);

            // Yutilgan donalar
            const { wCaptured, bCaptured, diff } = getCapturedAndMaterial();
            const topList = topColor === 'w' ? wCaptured : bCaptured;
            const bottomList = bottomColor === 'w' ? wCaptured : bCaptured;

            topCapturedEl.innerHTML = topList.map(k => `<span class="w-5 h-5 inline-block">${PIECE_SVGS[k]}</span>`).join('');
            bottomCapturedEl.innerHTML = bottomList.map(k => `<span class="w-5 h-5 inline-block">${PIECE_SVGS[k]}</span>`).join('');

            // Material ustunlik (+3, +5 va h.k.)
            topAdvEl.textContent = '';
            bottomAdvEl.textContent = '';
            if (diff > 0) {
                if (topColor === 'w') topAdvEl.textContent = `+${diff}`;
                else bottomAdvEl.textContent = `+${diff}`;
            } else if (diff < 0) {
                if (topColor === 'b') topAdvEl.textContent = `+${Math.abs(diff)}`;
                else bottomAdvEl.textContent = `+${Math.abs(diff)}`;
            }
        }

        // O'yin holati matnini yangilash
        function updateStatusPanel() {
            const turnName = chess.turn() === 'w' ? 'Oqlar' : 'Qoralar';
            statusCardEl.className = 'bg-slate-900/90 border p-4 rounded-2xl shadow-lg transition-all ';

            if (chess.in_checkmate()) {
                const winner = chess.turn() === 'w' ? 'Qoralar' : 'Oqlar';
                statusCardEl.classList.add('border-emerald-500', 'bg-emerald-950/30');
                statusTextEl.className = 'text-base sm:text-lg font-extrabold text-emerald-400';
                statusTextEl.textContent = `🏆 Shoh va Mot! ${winner} g'alaba qozondi!`;
            } else if (chess.in_stalemate()) {
                statusCardEl.classList.add('border-amber-500/50');
                statusTextEl.className = 'text-base sm:text-lg font-bold text-amber-400';
                statusTextEl.textContent = '🤝 Pat! O\'yin durang bilan yakunlandi.';
            } else if (chess.insufficient_material()) {
                statusCardEl.classList.add('border-amber-500/50');
                statusTextEl.className = 'text-base sm:text-lg font-bold text-amber-400';
                statusTextEl.textContent = '🤝 Durang! Mot qilish uchun donalar yetarli emas.';
            } else if (chess.in_threefold_repetition()) {
                statusCardEl.classList.add('border-amber-500/50');
                statusTextEl.className = 'text-base sm:text-lg font-bold text-amber-400';
                statusTextEl.textContent = '🤝 Durang! Bir xil holat 3 marta takrorlandi.';
            } else if (chess.in_draw()) {
                statusCardEl.classList.add('border-amber-500/50');
                statusTextEl.className = 'text-base sm:text-lg font-bold text-amber-400';
                statusTextEl.textContent = '🤝 O\'yin durang bilan yakunlandi.';
            } else if (chess.in_check()) {
                statusCardEl.classList.add('border-rose-500', 'bg-rose-950/30');
                statusTextEl.className = 'text-base sm:text-lg font-extrabold text-rose-400';
                statusTextEl.textContent = `⚠️ Shoh (Check)! ${turnName}ning yurishi`;
            } else {
                statusCardEl.classList.add('border-slate-800');
                statusTextEl.className = 'text-base sm:text-lg font-bold text-emerald-400';
                statusTextEl.textContent = `${turnName}ning yurishi`;
            }
        }

        // Yurishlar tarixini (Algebraic Notation) yangilash
        function updateMoveHistory() {
            const history = chess.history();
            moveCountEl.textContent = `${history.length} yurish`;

            if (history.length === 0) {
                moveHistoryListEl.innerHTML = `
                    <div class="text-center text-slate-500 text-xs py-10 font-sans">
                        O'yinni boshlash uchun oq donalardan birini tanlang.
                    </div>
                `;
                return;
            }

            let html = '';
            for (let i = 0; i < history.length; i += 2) {
                const moveNum = Math.floor(i / 2) + 1;
                const whiteMove = history[i];
                const blackMove = history[i + 1] || '';
                const isLastRow = i + 2 >= history.length;

                html += `
                    <div class="grid grid-cols-12 items-center px-2.5 py-1.5 rounded-lg ${isLastRow ? 'bg-slate-800/80 border border-slate-700/70' : 'hover:bg-slate-800/40'}">
                        <span class="col-span-2 text-slate-500 text-xs">${moveNum}.</span>
                        <span class="col-span-5 text-slate-100 font-semibold">${whiteMove}</span>
                        <span class="col-span-5 text-emerald-400 font-semibold">${blackMove}</span>
                    </div>
                `;
            }

            moveHistoryListEl.innerHTML = html;
            moveHistoryListEl.scrollTop = moveHistoryListEl.scrollHeight;
        }

        // Yangi o'yin boshlash
        function startNewGame() {
            if (aiTimer) clearTimeout(aiTimer);
            isAiThinking = false;
            thinkingEl.classList.add('hidden');
            pendingPromotion = null;
            promotionModalEl.classList.add('hidden');
            selectedSquare = null;
            legalMovesForSelected = [];
            chess.reset();
            sound.playMove();
            renderBoard();
        }

        // Yurishni orqaga qaytarish (Undo)
        function undoMove() {
            if (isAiThinking || chess.history().length === 0) return;

            if (gameMode === 'ai') {
                // Bot rejimida ham botning, ham o'yinchining yurishini bekor qilamiz
                if (chess.turn() === 'w' && chess.history().length >= 2) {
                    chess.undo();
                    chess.undo();
                } else {
                    chess.undo();
                }
            } else {
                chess.undo();
            }

            selectedSquare = null;
            legalMovesForSelected = [];
            sound.playMove();
            renderBoard();
        }

        // Taxtani aylantirish (Flip)
        function flipBoard() {
            boardOrientation = boardOrientation === 'w' ? 'b' : 'w';
            sound.playMove();
            renderBoard();
        }

        // Event Listeners
        btnNewGame.addEventListener('click', startNewGame);
        btnUndo.addEventListener('click', undoMove);
        btnFlip.addEventListener('click', flipBoard);

        btnModeAi.addEventListener('click', () => {
            if (gameMode === 'ai') return;
            gameMode = 'ai';
            btnModeAi.classList.add('active');
            btnModePvp.classList.remove('active');
            aiDiffContainer.classList.remove('hidden');
            boardOrientation = 'w';
            startNewGame();
        });

        btnModePvp.addEventListener('click', () => {
            if (gameMode === 'pvp') return;
            gameMode = 'pvp';
            btnModePvp.classList.add('active');
            btnModeAi.classList.remove('active');
            aiDiffContainer.classList.add('hidden');
            startNewGame();
        });

        btnDiffEasy.addEventListener('click', () => {
            if (aiDifficulty === 'easy') return;
            aiDifficulty = 'easy';
            btnDiffEasy.classList.add('active');
            btnDiffMedium.classList.remove('active');
            startNewGame();
        });

        btnDiffMedium.addEventListener('click', () => {
            if (aiDifficulty === 'medium') return;
            aiDifficulty = 'medium';
            btnDiffMedium.classList.add('active');
            btnDiffEasy.classList.remove('active');
            startNewGame();
        });

        btnSound.addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            document.getElementById('icon-sound-on').classList.toggle('hidden', !sound.enabled);
            document.getElementById('icon-sound-off').classList.toggle('hidden', sound.enabled);
            btnSound.classList.toggle('text-emerald-400', sound.enabled);
            btnSound.classList.toggle('text-slate-400', !sound.enabled);
            if (sound.enabled) sound.playMove();
        });

        // O'yinni dastlabki yuklash
        window.addEventListener('DOMContentLoaded', () => {
            renderBoard();
        });
    </script>
</body>
</html>
